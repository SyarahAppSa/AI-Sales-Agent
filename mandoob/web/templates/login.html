{% extends "base.html" %}{% block title %}تسجيل الدخول — المندوب الذكي لسيارة اب{% endblock %}{% block public %}
<div class="login card">
  <div class="logo"><div class="ar">المندوب الذكي</div><div class="en">لسيارة اب</div><span class="tag">سجّل الدخول للمتابعة</span></div>
  <form method="post" action="/login">
    <div class="field"><label>البريد الإلكتروني</label><input name="email" type="email" required class="ltr" style="text-align:left"></div>
    <div class="field"><label>كلمة المرور</label><input name="password" type="password" required></div>
    <button class="btn p" style="width:100%">دخول</button>
  </form>
</div>
{% endblock %}
